name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if that is your default branch name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build React Apps and Prepare Folders
        run: |
          # Only run if React folder exists
          if [ -d "React" ]; then
            cd React
            # Loop through each subfolder inside React
            for d in */; do
              # Check if it is a React app (has a package.json)
              if [ -d "$d" ] && [ -f "${d}package.json" ]; then
                echo "Building React app: $d"
                cd "$d"
                npm install
                npm run build
                cd ..
                
                # Replace the app's source code with its built files for hosting
                if [ -d "${d}dist" ]; then
                  mv "${d}dist" "../temp_dist"
                  rm -rf "$d"
                  mkdir "$d"
                  cp -a ../temp_dist/. "$d/"
                  rm -rf ../temp_dist
                fi
              fi
            done
            cd ..
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "." # Uploads everything (HTML tasks + built React apps)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
