name: Deploy React Apps

on:
  push:
    branches:
      - main
    paths:
      - "React/**"
      - ".github/workflows/deploy-react-apps.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Create deployment directory
        run: |
          rm -rf _site
          mkdir -p _site/React

      - name: Build all React apps
        shell: bash
        run: |
          for app in React/*; do
            if [ -f "$app/package.json" ]; then
              name=$(basename "$app")

              echo "======================================"
              echo "Building: $name"
              echo "======================================"

              cd "$app"

              npm ci
              npm run build

              cd ../..

              mkdir -p "_site/React/$name"
              cp -r "$app/dist/." "_site/React/$name/"
            fi
          done

      - name: Create React apps index
        shell: bash
        run: |
          cat > _site/React/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>React Projects</title>
          </head>
          <body>
            <h1>React Projects</h1>
            <ul>
          EOF

          for app in React/*; do
            if [ -f "$app/package.json" ]; then
              name=$(basename "$app")
              echo "<li><a href=\"./$name/\">$name</a></li>" >> _site/React/index.html
            fi
          done

          cat >> _site/React/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
